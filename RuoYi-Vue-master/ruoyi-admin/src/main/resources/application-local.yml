# Opt in with --spring.profiles.active=druid,local. Never use this profile in production.
payment:
  mode: mock
wechat:
  miniapp:
    mock-enabled: true
    # Leave both blank to reuse the enabled teacher with the lowest user_id.
    # Explicit username takes precedence over phone; invalid config never falls back.
    mock-teacher-username: ${WECHAT_MOCK_TEACHER_USERNAME:}
    mock-teacher-phone: ${WECHAT_MOCK_TEACHER_PHONE:}
